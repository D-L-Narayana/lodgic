<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lodgic — hotel search & reservation engine</title>
    <meta name="description" content="Search 4,000 hotels in 40 cities with live availability, demand-based pricing and a learning-to-rank model — a full booking product built on an open-source engine." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf8f4" />
    <meta property="og:title" content="Lodgic — hotel search & reservation engine" />
    <meta property="og:description" content="Search 4,000 hotels in 40 cities with live availability, demand-based pricing and an explainable learning-to-rank model." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lodgic-jade.vercel.app/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("lodgic-theme");
          var dark = t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = dark ? "#141a20" : "#faf8f4";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
